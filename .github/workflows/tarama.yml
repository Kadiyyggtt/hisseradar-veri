name: Tarama

# Günde dört kez, hafta içi: BIST açılış sonrası (10:17 TR), BIST gün ortası (13:47 TR),
# BIST kapanış sonrası (18:17 TR), ABD kapanış sonrası (00:47 TR; ABD 16:00 ET kapanışı
# yaz saatinde 20:00, kışın 21:00 UTC). Saatler UTC; Türkiye UTC+3.
# Dakikalar 0/30'dan uzak: GitHub o dakikalarda kuyruğu dolduruyor, iş gecikiyor ya da düşüyor.
on:
  schedule:
    - cron: '17 7 * * 1-5'
    - cron: '47 10 * * 1-5'
    - cron: '17 15 * * 1-5'
    - cron: '47 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tarayıcıları sına
        run: npm run tara:test
      - name: Tara
        run: npm run tara
        env:
          ESZAMANLI: '3'
      - name: Sonucu depoya yaz
        run: |
          git config user.name "hisseradar-tarama"
          git config user.email "tarama@users.noreply.github.com"
          git add docs/tarama
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "Tarama sonucu $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Koşu sürerken main'e başka commit gelmiş olabilir (24 Ekim: push reddedildi, sonuç yayınlanmadı): üç kez çekip yeniden dene.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          echo "sonuç gönderilemedi" && exit 1
      # Bildirim yayından SONRA: push düşerse iş burada durur, sonraki koşu aynı farkı yeniden
      # bulup bildirir; önce gönderip sonra yayımlayamazsak aynı bildirim ikinci kez giderdi.
      # FCM hatası taramanın başarısını bozmaz (sonuç zaten yayında).
      - name: Bildirim gönder
        continue-on-error: true
        run: npm run bildir
        env:
          FCM_SERVIS_HESABI: ${{ secrets.FCM_SERVIS_HESABI }}
