name: Hisse sicili

# Cumartesi 02:13 UTC (dakika 0/30'dan uzak, GitHub kuyruğu): her hissenin son 500 gününde formasyonlar gün gün yeniden taranır,
# sonuç docs/tarama/hisse-sicil.json. Haftada bir yeter; günlük koşuyu yormasın.
on:
  schedule:
    - cron: '13 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  sicil:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Hisse sicilini hesapla
        run: npm run hisse-sicil
        env:
          ESZAMANLI: '3'
      - name: Sonucu depoya yaz
        run: |
          git config user.name "hisseradar-tarama"
          git config user.email "tarama@users.noreply.github.com"
          git add docs/tarama/hisse-sicil.json
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "Hisse sicili $(date -u +'%Y-%m-%d') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          echo "sonuç gönderilemedi" && exit 1
