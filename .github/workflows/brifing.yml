name: Brifing

# Sabah brifingi hafta içi 09:45 TR (06:45 UTC), haftalık özet pazar 18:07 TR (15:07 UTC).
# Dakikalar 0/30'dan uzak (GitHub kuyruğu). Tarama 24 saatten (hafta sonu payıyla) eskiyse gönderilmez.
# Son yayınlanmış tarama sonucunu okur; dosyaya yazmaz, yalnız bildirim gönderir.
on:
  schedule:
    - cron: '45 6 * * 1-5'
    - cron: '7 15 * * 0'
  workflow_dispatch:
    inputs:
      tur:
        description: 'sabah ya da hafta'
        required: true
        default: 'sabah'

permissions:
  contents: read

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Elle girilen değer kabuğa doğrudan gömülmez (komut enjeksiyonu): env üzerinden okunur ve süzülür.
      - name: Tür
        id: tur
        env:
          GIRDI: ${{ github.event.inputs.tur }}
        run: |
          case "$GIRDI" in
            sabah|hafta) tur="$GIRDI" ;;
            "") if [ "$(date -u +%u)" = "7" ]; then tur=hafta; else tur=sabah; fi ;;
            *) echo "::error::tur yalnız 'sabah' ya da 'hafta' olabilir"; exit 1 ;;
          esac
          echo "tur=$tur" >> "$GITHUB_OUTPUT"
      - name: Brifing gönder
        run: npm run brifing -- "$TUR"
        env:
          TUR: ${{ steps.tur.outputs.tur }}
          FCM_SERVIS_HESABI: ${{ secrets.FCM_SERVIS_HESABI }}
