name: Brifing

# Yalnız haftalık özet (pazar 18:23 TR = 15:23 UTC; dakika :23, GitHub kuyruğunun yoğun olmadığı yer)
# ve elle tetikleme. Sabah brifingi burada değil: tarama.yml günün ilk sabah koşusunun sonunda gönderir,
# böylece cron gecikse de brifing taramayla aynı anda gelir. Tarama 24 saatten (hafta sonu payıyla)
# eskiyse gönderilmez; sessiz saatte (22:00-08:00 TR) gönderilmez.
# Son yayınlanmış tarama sonucunu okur; dosyaya yazmaz, yalnız bildirim gönderir.
on:
  schedule:
    - cron: '23 15 * * 0'
  workflow_dispatch:
    inputs:
      tur:
        description: 'sabah ya da hafta'
        required: true
        default: 'hafta'

permissions:
  contents: read

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # Elle girilen değer kabuğa doğrudan gömülmez (komut enjeksiyonu): env üzerinden okunur ve süzülür.
      - name: Tür
        id: tur
        env:
          GIRDI: ${{ github.event.inputs.tur }}
        run: |
          case "$GIRDI" in
            sabah|hafta) tur="$GIRDI" ;;
            "") tur=hafta ;;
            *) echo "::error::tur yalnız 'sabah' ya da 'hafta' olabilir"; exit 1 ;;
          esac
          echo "tur=$tur" >> "$GITHUB_OUTPUT"
      - name: Brifing gönder
        timeout-minutes: 3
        run: npm run brifing -- "$TUR"
        env:
          TUR: ${{ steps.tur.outputs.tur }}
          FCM_SERVIS_HESABI: ${{ secrets.FCM_SERVIS_HESABI }}
